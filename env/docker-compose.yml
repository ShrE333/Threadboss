services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: threadboss
      POSTGRES_USER: threadboss
      POSTGRES_PASSWORD: threadboss-dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  gateway:
    build: .
    env_file: [.env]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

  worker:
    build: .
    env_file: [.env]
    command: python -m app.worker
    depends_on: [postgres, redis]
    volumes: ["whisper_cache:/root/.cache/huggingface"]

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
